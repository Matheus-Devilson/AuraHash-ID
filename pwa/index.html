<script>
/* ============================================================
   AuraHash ID — PWA Reader v2.0.1
   Lee Data Matrix, descifra capas AES-256-GCM y verifica Ed25519.
   v2.0.1: estrategia dual para "Subir imagen" (imagen completa,
   luego crop 70% central si falla).
   ============================================================ */

'use strict';

// --- Llaves embebidas (MODO DEMO) ---
const AES_KEY_B64 = 'Fy2/ZT+YDUO+cF6KGBSleP+lMiaf3tl0IkCGRSC0ruM=';
const ED25519_PUB_B64 = 'SPLjOcVI5tEBAoTQTg2XH6p4p7jf+xkOmtM+5RhHP8Q=';

// --- Prefijos de cifrado ---
const PREFIJO_CIFRADO_ZLIB = 'AES256GCMZ:';
const PREFIJO_CIFRADO = 'AES256GCM:';

// --- Mapa inverso de claves PUB ---
const MAPA_PUB_INV = {
  p: 'perfil',
  t: 'tipo',
  i: 'instruccion',
  n: 'nombre_pila',
  a: 'alergias_criticas',
  v: 'id_visual',
  e: 'evento',
};

// --- Estado global ---
let codeReader = null;
let videoStream = null;
let scanning = false;
let scanTimeout = null;

// --- Utilidades ---
function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

function bytesToHex(bytes) {
  return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function sha256Hex(text) {
  const buf = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return bytesToHex(new Uint8Array(hash));
}

// --- Estado de conexión ---
function actualizarEstadoConexion() {
  const el = document.getElementById('status');
  if (navigator.onLine) {
    el.textContent = '● En línea';
    el.className = 'status online';
  } else {
    el.textContent = '● Offline';
    el.className = 'status offline';
  }
}
window.addEventListener('online', actualizarEstadoConexion);
window.addEventListener('offline', actualizarEstadoConexion);

// --- Mensajes de estado ---
function setStatusMsg(msg, tipo = '') {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = 'status-msg' + (tipo ? ' ' + tipo : '');
}
function clearStatusMsg() {
  setStatusMsg('');
}

// --- Parseo del payload ---
function parsearPayload(payload) {
  const bloques = { PUB: '', MED: '', ADM: '', SHA: '', SIG: '' };
  const partes = payload.trim().split('|');
  for (const parte of partes) {
    const idx = parte.indexOf(':');
    if (idx < 0) continue;
    const prefijo = parte.slice(0, idx).trim().toUpperCase();
    if (prefijo in bloques) bloques[prefijo] = parte.slice(idx + 1);
  }
  return bloques;
}

// --- Desminificación PUB ---
function desminificarPUB(obj) {
  if (!obj || typeof obj !== 'object') return obj;
  const out = {};
  for (const [k, v] of Object.entries(obj)) {
    out[MAPA_PUB_INV[k] || k] = v;
  }
  return out;
}

// --- Descompresión zlib (DecompressionStream nativo) ---
async function descomprimirZlib(bytes) {
  if (typeof DecompressionStream === 'undefined') {
    throw new Error('Este navegador no soporta DecompressionStream (zlib). Usa Chrome 80+, Edge 80+, Safari 16.4+ o Firefox 113+.');
  }
  const ds = new DecompressionStream('deflate');
  const writer = ds.writable.getWriter();
  writer.write(bytes);
  writer.close();
  const reader = ds.readable.getReader();
  const chunks = [];
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
  }
  const total = chunks.reduce((s, c) => s + c.length, 0);
  const out = new Uint8Array(total);
  let offset = 0;
  for (const c of chunks) { out.set(c, offset); offset += c.length; }
  return out;
}

// --- Descifrado AES-256-GCM ---
async function descifrarCapa(textoCifrado) {
  if (!textoCifrado) return '';

  let usarZlib = false;
  let b64 = '';
  if (textoCifrado.startsWith(PREFIJO_CIFRADO_ZLIB)) {
    usarZlib = true;
    b64 = textoCifrado.slice(PREFIJO_CIFRADO_ZLIB.length);
  } else if (textoCifrado.startsWith(PREFIJO_CIFRADO)) {
    usarZlib = false;
    b64 = textoCifrado.slice(PREFIJO_CIFRADO.length);
  } else {
    throw new Error('Prefijo de cifrado desconocido');
  }

  const paquete = b64ToBytes(b64);
  if (paquete.length < 12 + 16) throw new Error('Paquete cifrado demasiado corto');

  const nonce = paquete.slice(0, 12);
  const ctConTag = paquete.slice(12);

  const keyBytes = b64ToBytes(AES_KEY_B64);
  const key = await crypto.subtle.importKey(
    'raw', keyBytes, { name: 'AES-GCM' }, false, ['decrypt']
  );

  let planoBytes;
  try {
    planoBytes = new Uint8Array(await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: nonce, tagLength: 128 },
      key,
      ctConTag
    ));
  } catch (e) {
    throw new Error('Descifrado AES-GCM falló (¿clave incorrecta o datos alterados?)');
  }

  if (usarZlib) {
    planoBytes = await descomprimirZlib(planoBytes);
  }

  return new TextDecoder('utf-8').decode(planoBytes);
}

// --- Verificación Ed25519 ---
async function verificarEd25519(mensaje, sigB64) {
  if (typeof crypto.subtle.verify !== 'function') {
    return { ok: false, motivo: 'Web Crypto API no soporta verify' };
  }
  let sigBytes;
  try { sigBytes = b64ToBytes(sigB64); } catch { return { ok: false, motivo: 'Firma base64 inválida' }; }
  if (sigBytes.length !== 64) return { ok: false, motivo: `Firma mide ${sigBytes.length} bytes, esperado 64` };

  const pubBytes = b64ToBytes(ED25519_PUB_B64);
  let pubKey;
  try {
    pubKey = await crypto.subtle.importKey(
      'raw', pubBytes, { name: 'Ed25519' }, false, ['verify']
    );
  } catch (e) {
    return { ok: false, motivo: 'Ed25519 no soportado en este navegador', noSoportado: true };
  }

  try {
    const ok = await crypto.subtle.verify(
      { name: 'Ed25519' },
      pubKey,
      sigBytes,
      new TextEncoder().encode(mensaje)
    );
    return { ok, motivo: ok ? 'Firma válida' : 'La firma no coincide con el contenido' };
  } catch (e) {
    return { ok: false, motivo: `Error al verificar: ${e.message}` };
  }
}

// --- Renderizado del resultado ---
function renderKV(container, obj) {
  const kv = document.createElement('div');
  kv.className = 'kv';
  for (const [k, v] of Object.entries(obj)) {
    const kEl = document.createElement('div');
    kEl.className = 'k';
    kEl.textContent = k;
    const vEl = document.createElement('div');
    vEl.className = 'v';
    if (Array.isArray(v)) {
      vEl.textContent = v.join(', ');
    } else if (typeof v === 'object' && v !== null) {
      vEl.textContent = JSON.stringify(v);
    } else {
      vEl.textContent = String(v);
    }
    kv.appendChild(kEl);
    kv.appendChild(vEl);
  }
  container.appendChild(kv);
}

function crearSeccion(icono, titulo) {
  const sec = document.createElement('div');
  sec.className = 'section';
  const h = document.createElement('h3');
  h.innerHTML = `<span class="icon">${icono}</span>${titulo}`;
  sec.appendChild(h);
  return sec;
}

function crearCheckRow(estado, label, detalle) {
  const row = document.createElement('div');
  row.className = 'check-row';
  const icon = document.createElement('span');
  icon.className = `check-icon ${estado}`;
  icon.textContent = estado === 'ok' ? '✓' : estado === 'err' ? '✗' : '⚠';
  const text = document.createElement('div');
  text.className = 'check-text';
  const l = document.createElement('div');
  l.className = 'check-label';
  l.textContent = label;
  text.appendChild(l);
  if (detalle) {
    const d = document.createElement('div');
    d.className = 'check-detail';
    d.textContent = detalle;
    text.appendChild(d);
  }
  row.appendChild(icon);
  row.appendChild(text);
  return row;
}

function mensajeError(titulo, detalle) {
  const d = document.createElement('div');
  d.className = 'alert error';
  d.innerHTML = `<span class="icon">⚠️</span><div><strong>${titulo}</strong><br><span style="font-size:12px">${detalle}</span></div>`;
  return d;
}

function mensajeInfo(texto) {
  const d = document.createElement('div');
  d.style.color = 'var(--text-dim)';
  d.style.fontStyle = 'italic';
  d.style.fontSize = '13px';
  d.textContent = texto;
  return d;
}

async function renderizarResultado(payload) {
  const cont = document.getElementById('resultado-container');
  cont.innerHTML = '';
  clearStatusMsg();

  let bloques;
  try {
    bloques = parsearPayload(payload);
  } catch (e) {
    cont.appendChild(mensajeError('Payload malformado', e.message));
    return;
  }

  if (!bloques.PUB && !bloques.MED && !bloques.ADM) {
    cont.appendChild(mensajeError('Payload inválido', 'No se detectaron bloques PUB/MED/ADM.'));
    return;
  }

  // --- Detectar perfil ---
  let perfil = 'desconocido';
  let pubObj = null;
  if (bloques.PUB) {
    try {
      pubObj = desminificarPUB(JSON.parse(bloques.PUB));
      if (pubObj.perfil) perfil = String(pubObj.perfil).toLowerCase();
    } catch {}
  }

  const card = document.createElement('div');
  card.className = 'card';

  const badge = document.createElement('div');
  badge.className = `perfil-badge ${perfil}`;
  badge.textContent = `● Perfil: ${perfil}`;
  card.appendChild(badge);

  // --- Capa pública ---
  const secPub = crearSeccion('🌐', 'Capa pública (texto claro)');
  if (pubObj) {
    renderKV(secPub, pubObj);
  } else {
    const p = document.createElement('div');
    p.className = 'pub-raw';
    p.textContent = bloques.PUB || '(vacía)';
    secPub.appendChild(p);
  }
  card.appendChild(secPub);

  // --- Capa médica ---
  const secMed = crearSeccion('🏥', 'Capa médica (descifrada)');
  if (bloques.MED) {
    try {
      const plano = await descifrarCapa(bloques.MED);
      renderKV(secMed, JSON.parse(plano));
    } catch (e) {
      secMed.appendChild(mensajeError('No se pudo descifrar MED', e.message));
    }
  } else {
    secMed.appendChild(mensajeInfo('(vacía)'));
  }
  card.appendChild(secMed);

  // --- Capa administrativa ---
  const secAdm = crearSeccion('📋', 'Capa administrativa (descifrada)');
  if (bloques.ADM) {
    try {
      const plano = await descifrarCapa(bloques.ADM);
      renderKV(secAdm, JSON.parse(plano));
    } catch (e) {
      secAdm.appendChild(mensajeError('No se pudo descifrar ADM', e.message));
    }
  } else {
    secAdm.appendChild(mensajeInfo('(vacía)'));
  }
  card.appendChild(secAdm);

  // --- Verificaciones ---
  const secVerif = crearSeccion('🔐', 'Verificaciones');

  // SHA
  if (bloques.SHA) {
    try {
      const pubJson = bloques.PUB;
      const medJson = bloques.MED ? await descifrarCapa(bloques.MED) : '';
      const admJson = bloques.ADM ? await descifrarCapa(bloques.ADM) : '';

      const hPub = await sha256Hex(pubJson);
      const hMed = medJson ? await sha256Hex(medJson) : '';
      const hAdm = admJson ? await sha256Hex(admJson) : '';
      const hMaestro = await sha256Hex(hPub + hMed + hAdm);

      const shaPayload = bloques.SHA;
      const coincide = shaPayload.length === 64
        ? hMaestro === shaPayload
        : hMaestro.startsWith(shaPayload);

      secVerif.appendChild(crearCheckRow(
        coincide ? 'ok' : 'err',
        coincide ? 'Integridad SHA-256 OK' : 'Integridad SHA-256 FALLÓ',
        `Payload: ${shaPayload.slice(0, 16)}…  ·  Recalc: ${hMaestro.slice(0, 16)}…`
      ));
    } catch (e) {
      secVerif.appendChild(crearCheckRow('warn', 'No se pudo verificar SHA-256', e.message));
    }
  } else {
    secVerif.appendChild(crearCheckRow('warn', 'Sin hash SHA-256 en el payload', ''));
  }

  // Firma
  if (bloques.SIG) {
    const mensaje = `PUB:${bloques.PUB}|MED:${bloques.MED}|ADM:${bloques.ADM}|SHA:${bloques.SHA}`;
    const res = await verificarEd25519(mensaje, bloques.SIG);
    if (res.noSoportado) {
      secVerif.appendChild(crearCheckRow('warn', 'Ed25519 no soportado en este navegador', res.motivo));
    } else {
      secVerif.appendChild(crearCheckRow(
        res.ok ? 'ok' : 'err',
        res.ok ? 'Firma Ed25519 OK' : 'Firma Ed25519 FALLÓ',
        res.motivo
      ));
    }
  } else {
    secVerif.appendChild(crearCheckRow('warn', 'Sin firma Ed25519 (formato legacy)', ''));
  }

  card.appendChild(secVerif);

  // --- Botón limpiar ---
  const btnLimpiar = document.createElement('button');
  btnLimpiar.className = 'btn secondary';
  btnLimpiar.textContent = '↺ Escanear otro';
  btnLimpiar.style.marginTop = '12px';
  btnLimpiar.onclick = () => {
    cont.innerHTML = '';
    clearStatusMsg();
  };
  card.appendChild(btnLimpiar);

  cont.appendChild(card);
}

// --- Cámara + escaneo ---
async function iniciarCamara() {
  const video = document.getElementById('video');
  const container = document.getElementById('video-container');
  const btnStart = document.getElementById('btn-start');
  const btnRowStop = document.getElementById('btn-row-stop');

  btnStart.disabled = true;
  btnStart.innerHTML = '<span class="spinner"></span> Iniciando…';
  setStatusMsg('Iniciando cámara…');

  try {
    videoStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } },
      audio: false
    });
    video.srcObject = videoStream;
    container.style.display = 'block';
    btnStart.classList.add('hidden');
    btnRowStop.classList.remove('hidden');

    // Iniciar lector ZXing
    const hints = new Map();
    const formats = [
      ZXing.BarcodeFormat.DATA_MATRIX,
      ZXing.BarcodeFormat.QR_CODE,
    ];
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

    codeReader = new ZXing.BrowserMultiFormatReader(hints);
    scanning = true;

    setStatusMsg('🔍 Buscando Data Matrix… apunta la cámara al código', 'warn');
    let segundos = 0;
    scanTimeout = setInterval(() => {
      segundos++;
      if (segundos < 5) {
        setStatusMsg(`🔍 Buscando… (${segundos}s)`, 'warn');
      } else if (segundos < 10) {
        setStatusMsg(`🔍 No detectado. Acerca más la cámara o mejora la iluminación. (${segundos}s)`, 'warn');
      } else if (segundos < 20) {
        setStatusMsg(`🔍 Aún buscando… Prueba con el botón "Subir imagen". (${segundos}s)`, 'warn');
      } else {
        setStatusMsg('⏱ Tiempo de escaneo largo. Detén la cámara y sube una imagen.', 'err');
      }
    }, 1000);

    codeReader.decodeFromVideoElement(video, (result, err) => {
      if (!scanning) return;
      if (result) {
        scanning = false;
        clearInterval(scanTimeout);
        const texto = result.getText();
        setStatusMsg('✅ Código detectado. Procesando…', 'ok');
        detenerCamara();
        setTimeout(() => renderizarResultado(texto), 300);
      }
    });
  } catch (e) {
    btnStart.disabled = false;
    btnStart.textContent = '▶ Iniciar cámara y escanear';
    setStatusMsg('❌ No se pudo acceder a la cámara', 'err');
    const cont = document.getElementById('resultado-container');
    cont.innerHTML = '';
    cont.appendChild(mensajeError(
      'No se pudo acceder a la cámara',
      e.message + '. Verifica permisos y que uses HTTPS o localhost.'
    ));
  }
}

function detenerCamara() {
  scanning = false;
  if (scanTimeout) { clearInterval(scanTimeout); scanTimeout = null; }
  if (codeReader) {
    try { codeReader.reset(); } catch {}
    codeReader = null;
  }
  if (videoStream) {
    videoStream.getTracks().forEach(t => t.stop());
    videoStream = null;
  }
  document.getElementById('video-container').style.display = 'none';
  document.getElementById('btn-start').classList.remove('hidden');
  document.getElementById('btn-start').disabled = false;
  document.getElementById('btn-start').textContent = '▶ Iniciar cámara y escanear';
  document.getElementById('btn-row-stop').classList.add('hidden');
}

// --- Subir imagen (estrategia dual: imagen completa + crop 70%) ---
async function procesarImagenSubida(file) {
  clearStatusMsg();
  setStatusMsg('📁 Procesando imagen…');

  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = async () => {
    URL.revokeObjectURL(url);

    const hints = new Map();
    const formats = [
      ZXing.BarcodeFormat.DATA_MATRIX,
      ZXing.BarcodeFormat.QR_CODE,
    ];
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

    // Intento 1: imagen completa
    let reader = new ZXing.BrowserMultiFormatReader(hints);
    try {
      const result = await reader.decodeFromImageElement(img);
      setStatusMsg('✅ Código detectado. Procesando…', 'ok');
      setTimeout(() => renderizarResultado(result.getText()), 200);
      return;
    } catch (e) {
      // Continúa al intento 2
    }

    // Intento 2: recortar el 70% central
    setStatusMsg('🔍 Reintentando con recorte central…', 'warn');
    try {
      const canvas = document.createElement('canvas');
      const w = img.naturalWidth;
      const h = img.naturalHeight;
      const cropSize = Math.floor(Math.min(w, h) * 0.70);
      const cropX = Math.floor((w - cropSize) / 2);
      const cropY = Math.floor((h - cropSize) / 2);
      canvas.width = cropSize;
      canvas.height = cropSize;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, cropX, cropY, cropSize, cropSize, 0, 0, cropSize, cropSize);

      reader = new ZXing.BrowserMultiFormatReader(hints);
      const result = await reader.decodeFromCanvas(canvas);
      setStatusMsg('✅ Código detectado (con recorte). Procesando…', 'ok');
      setTimeout(() => renderizarResultado(result.getText()), 200);
    } catch (e) {
      setStatusMsg('❌ No se detectó código en la imagen', 'err');
      const cont = document.getElementById('resultado-container');
      cont.innerHTML = '';
      cont.appendChild(mensajeError(
        'No se detectó código',
        'Asegúrate de que la imagen contiene un Data Matrix visible. Intenta con una foto más nítida y con buena iluminación.'
      ));
    }
  };
  img.onerror = () => {
    URL.revokeObjectURL(url);
    setStatusMsg('❌ No se pudo leer la imagen', 'err');
  };
  img.src = url;
}

// --- Inicialización ---
document.addEventListener('DOMContentLoaded', () => {
  actualizarEstadoConexion();
  document.getElementById('btn-start').addEventListener('click', iniciarCamara);
  document.getElementById('btn-stop').addEventListener('click', detenerCamara);
  document.getElementById('btn-upload').addEventListener('click', () => {
    document.getElementById('file-input').click();
  });
  document.getElementById('file-input').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (file) procesarImagenSubida(file);
  });

  // Verificar soporte de zlib
  if (typeof DecompressionStream === 'undefined') {
    const aviso = document.getElementById('aviso-llaves');
    aviso.className = 'alert warn';
    aviso.innerHTML = '<span class="icon">⚠️</span><div><strong>Navegador no soporta DecompressionStream.</strong> Necesitas Chrome 80+, Edge 80+, Safari 16.4+ o Firefox 113+. No podrás descifrar capas con zlib.</div>';
  }

  // Verificar contexto seguro
  if (!window.isSecureContext) {
    const aviso = document.getElementById('aviso-llaves');
    aviso.className = 'alert warn';
    aviso.innerHTML = '<span class="icon">🔒</span><div><strong>Contexto no seguro.</strong> La cámara solo funciona en HTTPS o localhost. Abre esta PWA desde <code>http://localhost:8000</code> o desde un dominio HTTPS.</div>';
  }

  setStatusMsg('Listo. Pulsa "Iniciar cámara" o "Subir imagen".');
});
</script>
